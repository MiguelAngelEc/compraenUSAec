{% extends 'base.html' %}

{% block title %}Registrar Cliente - CompraEnUSAec{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
        <div class="mb-8 border-b pb-4">
            <h2 class="text-2xl font-bold text-gray-800">Registrar Nuevo Cliente</h2>
            <p class="text-gray-500 mt-1">Complete la información para agregar un cliente al sistema.</p>
        </div>

        <form method="POST" action="{% url 'registro' %}" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="col-span-1">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cédula / Código *</label>
                    <input type="text" name="codigo" value="{{ form_data.codigo|default:'' }}" required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Ej: 1234567890">
                </div>
                <div class="col-span-1">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo *</label>
                    <input type="text" name="nombre_apellido" value="{{ form_data.nombre_apellido|default:'' }}" required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Nombre y Apellido">
                </div>
                <div class="col-span-1">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                    <input type="text" name="telefono" value="{{ form_data.telefono|default:'' }}"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Ej: 0991234567">
                </div>
                <div class="col-span-1">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ciudad</label>
                    <input type="text" name="ciudad" value="{{ form_data.ciudad|default:'' }}"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Ej: Guayaquil">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
                    <input type="text" name="direccion" value="{{ form_data.direccion|default:'' }}"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Dirección completa">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                    <input type="email" name="email" value="{{ form_data.email|default:'' }}"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="correo@ejemplo.com">
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-6">
                <a href="{% url 'home' %}"
                    class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
                    Cancelar
                </a>
                <button type="submit"
                    class="px-6 py-2 bg-black text-white rounded-lg hover:bg-white hover:text-black border border-gray-900 transition-colors font-medium">
                    Guardar Cliente
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
