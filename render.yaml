# ===========================================
# Render Blueprint - CompraEnUSAec
# ===========================================

databases:
  - name: compraenusaec-db
    databaseName: compraenusaec
    user: compraenusaec
    plan: free

services:
  - type: web
    name: compraenusaec-recibo
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn compraenUSAec_Recibo.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DJANGO_SETTINGS_MODULE
        value: compraenUSAec_Recibo.settings_render
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: compraenusaec-db
          property: connectionString
